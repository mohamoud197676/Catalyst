# Development-period outcome study (2012-2019 only; the 2020-2025 holdout is not touched).
name: dev-outcomes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/dev_outcomes.py", ".github/workflows/dev-outcomes.yml"]
permissions:
  contents: write
jobs:
  outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install exchange_calendars
      - name: outcomes
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          mkdir -p results/dev_outcomes
          python scripts/dev_outcomes.py 2>&1 | tee results/dev_outcomes/log.txt
      - name: commit results
        if: always()
        run: |
          git config user.name "catalyst-bot"
          git config user.email "catalyst-bot@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "dev outcomes $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*7)); done
