# Re-run 2026-11-17 after repository made public.
# Live checks that close Phase 0. Runs on every push to main that touches code, or by hand.
# Results are committed to results/ so they can be read without access to the Actions logs.
name: smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "config/**", ".github/workflows/smoke.yml"]
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install exchange_calendars pytest
      - name: offline tests
        run: python -m pytest -q 2>&1 | tee pytest.txt
      - name: live checks
        env:
          PYTHONPATH: src
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          mkdir -p results
          test -n "$SEC_USER_AGENT" || echo "SEC_USER_AGENT secret is EMPTY on this repository" | tee results/smoke.txt
          python -m catalyst.cli --db smoke.db --user-agent "$SEC_USER_AGENT" smoke 2>&1 | tee -a results/smoke.txt || true
          { echo "run: $(date -u +%FT%TZ)"; tail -1 pytest.txt; } >> results/smoke.txt
      - name: commit results
        run: |
          git config user.name "catalyst-bot"
          git config user.email "catalyst-bot@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "smoke results $(date -u +%FT%TZ)"
          git pull --rebase && git push
