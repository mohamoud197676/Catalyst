[project]
name = "catalyst"
version = "0.1.0"
description = "Phase 0 research foundation: filings, borrow history, trading costs. Paper mode only."
requires-python = ">=3.11"
dependencies = ["exchange_calendars>=4.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
catalyst = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
