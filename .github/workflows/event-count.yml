# Re-run 2026-11-17 18:21 after SEC_USER_AGENT secret added.
# Step 3: the free feasibility count for H1 (SEC data only, no price data, no cost).
# Runs when the counting script changes, or by hand. Takes up to a few hours at SEC's rate limit.
name: event-count
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/count_events.py", ".github/workflows/event-count.yml"]
permissions:
  contents: write
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install exchange_calendars
      - name: count
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          mkdir -p results
          python scripts/count_events.py 2010 2025 2>&1 | tee results/event_count_log.txt || true
      - name: commit results
        if: always()
        run: |
          git config user.name "catalyst-bot"
          git config user.email "catalyst-bot@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "event count $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*7)); done
